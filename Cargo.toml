[package]
name = "syntax-highlighter"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["Stefano Baghino <stefano@baghino.me>"]
description = "A compact syntax highlighting engine."
repository = "https://github.com/stefanobaghino/syntax-highlighter"
homepage = "https://github.com/stefanobaghino/syntax-highlighter"
readme = "README.md"
keywords = ["syntax-highlighting", "peg", "parser"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]
publish = false
exclude = [".github"]

[dependencies]

[build-dependencies]
# Build-script-only dep: feeds `build.rs` the UAX #31 predicates used to
# bake property interval tables into `$OUT_DIR/unicode_properties.rs`.
# The runtime closure does not link this crate.
unicode-ident = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "demo"
path = "src/bin/demo/main.rs"

[[bin]]
name = "pegc"
path = "src/bin/pegc.rs"

[[bin]]
name = "pegdb"
path = "src/bin/pegdb.rs"

[[bench]]
name = "memo"
path = "benches/memo.rs"
harness = false

[[bench]]
name = "incremental"
path = "benches/incremental.rs"
harness = false

[[bench]]
name = "follow_set"
path = "benches/follow_set.rs"
harness = false

[[bench]]
name = "lint"
path = "benches/lint.rs"
harness = false
